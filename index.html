<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elevation Shading</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.10.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <aside id="panel">
    <header>
      <h1>Elevation shading</h1>
      <button id="collapse" type="button" aria-expanded="true" title="Collapse panel">–</button>
    </header>

    <div id="panel-body">
      <section>
        <div class="row">
          <label for="threshold">Shade above</label>
          <output id="threshold-value">–</output>
        </div>
        <input id="threshold" type="range" min="0" max="1" step="1" value="0" disabled>
        <div class="row small muted">
          <span id="range-min">–</span>
          <span id="range-max">–</span>
        </div>
        <div id="ramp" aria-hidden="true"></div>
        <div class="row small">
          <button id="peak" type="button" class="link" disabled>Highest in view: –</button>
          <span id="status" class="muted"></span>
        </div>
      </section>

      <section>
        <h2>Base map</h2>
        <div class="choices" role="radiogroup">
          <label><input type="radio" name="base" value="usgs" checked> USGS Topo</label>
          <label><input type="radio" name="base" value="opentopo"> OpenTopoMap</label>
          <label><input type="radio" name="base" value="streets"> Streets</label>
          <label><input type="radio" name="base" value="imagery"> Satellite</label>
        </div>
      </section>

      <section>
        <h2>Overlays</h2>
        <div class="choices">
          <label><input type="checkbox" id="ov-shade" checked> Elevation shading</label>
          <label><input type="checkbox" id="ov-hillshade" checked> Hillshade</label>
          <label><input type="checkbox" id="ov-roads"> Roads &amp; places</label>
        </div>
        <div class="row">
          <label for="opacity" class="small">Shading opacity</label>
          <input id="opacity" type="range" min="0.1" max="1" step="0.05" value="0.6">
        </div>
        <div class="row">
          <span class="small">Units</span>
          <span class="choices inline">
            <label><input type="radio" name="units" value="ft" checked> ft</label>
            <label><input type="radio" name="units" value="m"> m</label>
          </span>
        </div>
      </section>

      <p id="cursor" class="small muted">Hover the map for elevation.</p>
    </div>
  </aside>

  <script type="module" src="app.js"></script>
</body>
</html>
